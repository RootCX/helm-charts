name: Publish Helm repository

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "charts/**"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure GitHub Pages author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: docker/setup-buildx-action@v3
      - name: Validate and package chart
        run: |
          helm lint charts/rootcx
          mkdir -p dist
          helm package charts/rootcx --destination dist
      - name: Verify referenced public images exist
        run: |
          helm template rootcx charts/rootcx \
            | awk '/^[[:space:]]*image: / {gsub(/[",]/, "", $2); print $2}' \
            | sort -u \
            | while read -r image; do
                docker buildx imagetools inspect "$image" >/dev/null
              done
      - name: Publish GitHub releases and Helm index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          packages_with_index: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish immutable OCI charts
        run: |
          for chart in dist/*.tgz; do
            [ -e "$chart" ] || continue
            helm push "$chart" oci://ghcr.io/rootcx/helm-charts
          done
