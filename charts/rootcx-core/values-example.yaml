# RootCX Core — Example production values
# Copy this file, fill in secrets, and adapt to your environment.

replicaCount: 1

global:
  platform: kubernetes
  rootcx:
    # Set this to the real FQDN that already resolves to your ingress.
    hosts:
      core: ""
    # Optional. Leave empty only when the platform default certificate is
    # trusted and covers the configured host.
    tls:
      secretName: ""

# Expose via Kubernetes Ingress OR OpenShift Route (pick one)
ingress:
  enabled: false
  className: nginx
  hosts: []
  tls: []

# For OpenShift, set global.platform=openshift. The chart creates the Route
# from global.rootcx.hosts.core automatically.

# SSO via OIDC (Keycloak, Azure AD, Okta, etc.)
oidc:
  issuer: https://idp.example.com/realms/myrealm
  clientId: rootcx
  clientSecret: CHANGE_ME

disablePasswordLogin: "true"

# Optional: the real OpenAI Chat Completions-compatible AI Gateway endpoint.
# Do not copy a guessed hostname; obtain the exact URL from the platform team.
ai:
  openai:
    baseUrl: ""

# Stable application secrets. Generate them once and retain them across every
# upgrade. masterKey encrypts the application secret vault.
jwtSecret: CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS
masterKey: CHANGE_ME_TO_EXACTLY_64_HEXADECIMAL_CHARACTERS

# Embedded PostgreSQL (with PGMQ + pg_cron)
postgresql:
  enabled: true
  auth:
    username: rootcx
    password: CHANGE_ME
    database: rootcx
  persistence:
    enabled: true
    size: 20Gi

# Core data volume
persistence:
  enabled: true
  size: 10Gi

# Resources
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# If the AI Gateway resolves to a private address, add the exact namespace,
# pod selector, or CIDR supplied by the platform team. Public HTTPS egress is
# already allowed; RFC1918 egress is denied unless explicitly added here.
networkPolicy:
  enabled: true
  extraEgress: []
