{{- $secretName := include "rootcx-core.tlsSecretName" . -}}
{{- $createRBAC := dig "tls" "openshift" "createRouterRBAC" true .Values.global.rootcx -}}
{{- $createCoreRBAC := dig "createRouterRBAC" true .Values.route.tls -}}
{{- $routerNamespace := dig "tls" "openshift" "routerServiceAccount" "namespace" "openshift-ingress" .Values.global.rootcx -}}
{{- $routerName := dig "tls" "openshift" "routerServiceAccount" "name" "router" .Values.global.rootcx -}}
{{- if and (eq .Values.global.platform "openshift") $secretName $createRBAC $createCoreRBAC -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rootcx-core.fullname" . }}-tls-secret-reader
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rootcx-core.fullname" . }}-tls-secret-reader
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rootcx-core.fullname" . }}-tls-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ $routerName | quote }}
    namespace: {{ $routerNamespace | quote }}
{{- end }}
