{{- $managedHost := dig "hosts" "core" "" .Values.global.rootcx -}}
{{- $managed := and (eq (include "rootcx-core.platform" .) "openshift") $managedHost -}}
{{- if or .Values.route.enabled $managed -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "rootcx-core.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
spec:
  {{- if (include "rootcx-core.routeHost" .) }}
  host: {{ include "rootcx-core.routeHost" . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "rootcx-core.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- with .Values.route.tls }}
  tls:
    termination: {{ .termination }}
    insecureEdgeTerminationPolicy: {{ .insecureEdgeTerminationPolicy }}
    {{- with (include "rootcx-core.tlsSecretName" $) }}
    externalCertificate:
      name: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
