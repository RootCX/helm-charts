{{- $managedHost := dig "hosts" "core" "" .Values.global.rootcx -}}
{{- $tlsSecret := include "rootcx-core.tlsSecretName" . -}}
{{- $routeHost := default .Values.route.host $managedHost -}}
{{- if eq (include "rootcx-core.deploymentMode" .) "production" -}}
{{- if not .Values.existingSecret -}}
{{- $_ := required "jwtSecret is required in production unless existingSecret is set" .Values.jwtSecret -}}
{{- $_ := required "masterKey is required in production unless existingSecret is set" .Values.masterKey -}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.password) -}}
{{- fail "postgresql.auth.password is required in production when PostgreSQL is embedded" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $tlsSecret (not $routeHost) -}}
{{- fail "global.rootcx.hosts.core or route.host is required when an external TLS Secret is set" -}}
{{- end -}}
{{- if and (include "rootcx-core.tlsSecretName" .) (eq .Values.route.tls.termination "passthrough") -}}
{{- fail "an external TLS certificate cannot be used with passthrough Route termination" -}}
{{- end -}}
