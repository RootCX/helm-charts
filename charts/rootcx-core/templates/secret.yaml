{{- if not .Values.existingSecret }}
{{- $secretName := include "rootcx-core.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = default dict $existing.data -}}
{{- end -}}
{{- $jwtSecret := .Values.jwtSecret -}}
{{- if and (not $jwtSecret) (hasKey $existingData "ROOTCX_JWT_SECRET") -}}
{{- $jwtSecret = index $existingData "ROOTCX_JWT_SECRET" | b64dec -}}
{{- else if not $jwtSecret -}}
{{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}
{{- $masterKey := .Values.masterKey -}}
{{- if and (not $masterKey) (hasKey $existingData "ROOTCX_MASTER_KEY") -}}
{{- $masterKey = index $existingData "ROOTCX_MASTER_KEY" | b64dec -}}
{{- else if not $masterKey -}}
{{- $masterKey = randBytes 32 | sha256sum -}}
{{- end -}}
{{- $postgresPassword := .Values.postgresql.auth.password -}}
{{- if and .Values.postgresql.enabled (not $postgresPassword) (hasKey $existingData "POSTGRES_PASSWORD") -}}
{{- $postgresPassword = index $existingData "POSTGRES_PASSWORD" | b64dec -}}
{{- else if and .Values.postgresql.enabled (not $postgresPassword) -}}
{{- $postgresPassword = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.databaseUrl }}
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $postgresPassword (include "rootcx-core.postgresql.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  {{- fail "Either databaseUrl or postgresql.enabled must be set" }}
  {{- end }}
  ROOTCX_JWT_SECRET: {{ $jwtSecret | quote }}
  ROOTCX_MASTER_KEY: {{ $masterKey | quote }}
  {{- if (include "rootcx-core.oidcClientSecret" .) }}
  ROOTCX_OIDC_CLIENT_SECRET: {{ include "rootcx-core.oidcClientSecret" . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- end }}
{{- end }}
