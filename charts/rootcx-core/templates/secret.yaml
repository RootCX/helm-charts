apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcx-core.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "rootcx-core.databaseUrl" . | quote }}
  {{- if .Values.jwtSecret }}
  ROOTCX_JWT_SECRET: {{ .Values.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.masterKey }}
  ROOTCX_MASTER_KEY: {{ .Values.masterKey | quote }}
  {{- end }}
  {{- if .Values.oidc.clientSecret }}
  ROOTCX_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
