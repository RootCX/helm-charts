apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rootcx-core.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rootcx-core.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      {{- if or (not .Values.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "rootcx-core.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rootcx-core.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- if eq (include "rootcx-core.platform" $) "openshift" }}
        {{- omit . "fsGroup" "fsGroupChangePolicy" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: core
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          env:
            - name: ROOTCX_BIND
              value: "true"
            {{- if (include "rootcx-core.publicUrl" .) }}
            - name: ROOTCX_PUBLIC_URL
              value: {{ include "rootcx-core.publicUrl" . | quote }}
            {{- end }}
            - name: ROOTCX_DISABLE_PASSWORD_LOGIN
              value: {{ .Values.disablePasswordLogin | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.ai.openai.baseUrl }}
            - name: ROOTCX_OPENAI_BASE_URL
              value: {{ .Values.ai.openai.baseUrl | quote }}
            {{- end }}
            {{- if (include "rootcx-core.oidcIssuer" .) }}
            - name: ROOTCX_OIDC_ISSUER
              value: {{ include "rootcx-core.oidcIssuer" . | quote }}
            - name: ROOTCX_OIDC_CLIENT_ID
              value: {{ include "rootcx-core.oidcClientId" . | quote }}
            {{- end }}
            {{- if .Values.trustedCA }}
            - name: SSL_CERT_FILE
              value: /etc/pki/tls/certs/ca-bundle.crt
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "rootcx-core.secretName" . }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.trustedCA }}
            - name: trusted-ca
              mountPath: /etc/pki/tls/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "rootcx-core.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.trustedCA }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCA }}
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
