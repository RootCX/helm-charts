# RootCX Core Helm Chart — values.yaml
# All configuration is done via environment variables.
# This file documents every configurable parameter.

global:
  # -- Target platform. auto detects OpenShift APIs and otherwise uses Kubernetes.
  platform: auto
  rootcx:
    # -- quickstart generates local secrets; production requires explicit values.
    deploymentMode: quickstart
    corePublicUrl: ""
    oidcIssuer: ""
    oidcClientId: ""
    oidcClientSecret: ""
    # Canonical externally reachable hosts. Leave empty to keep using the
    # legacy ingress/route and publicUrl values below.
    hosts:
      portal: ""
      core: ""
    # Optional kubernetes.io/tls Secret in the release namespace. On
    # OpenShift 4.19+ it is referenced by Route.spec.tls.externalCertificate;
    # on Kubernetes it is referenced by Ingress.spec.tls.secretName.
    tls:
      secretName: ""
      openshift:
        # Grant the OpenShift router read-only access to this one Secret, as
        # required by Route externalCertificate SubjectAccessReview.
        createRouterRBAC: true
        routerServiceAccount:
          namespace: openshift-ingress
          name: router

# -- Number of Core replicas (1 for single-instance deployments)
replicaCount: 1

# -- Recreate avoids RWO volume multi-attach failures during upgrades.
strategy:
  type: Recreate

# -- Core container image
image:
  repository: ghcr.io/rootcx/core
  tag: ""  # Defaults to appVersion from Chart.yaml
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Existing Secret containing DATABASE_URL and optional ROOTCX_JWT_SECRET,
# ROOTCX_MASTER_KEY, ROOTCX_OIDC_CLIENT_SECRET, and POSTGRES_PASSWORD.
existingSecret: ""

# -- Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
# Do NOT hardcode runAsUser — OpenShift assigns UIDs from namespace range.
# On vanilla Kubernetes the image's USER directive (UID 1000) takes effect.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # Used on Kubernetes. Omitted automatically when global.platform=openshift.
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# =============================================================================
# CORE CONFIGURATION (environment variables)
# =============================================================================

# -- PostgreSQL connection string (REQUIRED)
# Format: postgres://user:password@host:port/dbname
databaseUrl: ""

# -- JWT signing secret. Auto-generated and preserved in quickstart mode.
jwtSecret: ""

# -- Master encryption key. Auto-generated and preserved in quickstart mode.
masterKey: ""

# -- Public URL of this RootCX instance (used for OIDC callbacks, magic links)
# Example: https://rootcx.example.com
publicUrl: ""

# -- Disable password-based login (set "true" to force SSO-only)
disablePasswordLogin: "false"

# -- Log level (trace, debug, info, warn, error)
logLevel: "info"

# =============================================================================
# AI GATEWAY
# =============================================================================

ai:
  openai:
    # -- Optional base URL for an OpenAI Chat Completions-compatible endpoint.
    # Include the API prefix expected by the gateway, commonly /v1. When empty,
    # OpenAI agents use the provider's default public endpoint.
    baseUrl: ""

# =============================================================================
# SSO / OIDC CONFIGURATION
# =============================================================================

oidc:
  # -- OIDC issuer URL (e.g. https://keycloak.example.com/realms/myrealm)
  issuer: ""
  # -- OIDC client ID
  clientId: ""
  # -- OIDC client secret
  clientSecret: ""

# =============================================================================
# SERVICE
# =============================================================================

service:
  type: ClusterIP
  port: 9100

# =============================================================================
# INGRESS
# =============================================================================

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rootcx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# OpenShift Route (alternative to ingress)
# =============================================================================

route:
  enabled: false
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # Optional per-Route override. Prefer global.rootcx.tls.secretName when
    # Core is installed as part of the RootCX dedicated chart.
    externalCertificateSecretName: ""
    # Internal composition override. Keep true for standalone Core installs;
    # the RootCX umbrella chart creates the shared router RBAC once.
    createRouterRBAC: true

# =============================================================================
# PERSISTENCE (Core data volume at /data)
# =============================================================================

persistence:
  enabled: true
  # -- Retain the Core data PVC when the Helm release is uninstalled.
  keep: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  existingClaim: ""

# =============================================================================
# RESOURCES
# =============================================================================

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# =============================================================================
# PROBES
# =============================================================================

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24

# =============================================================================
# POSTGRESQL (embedded in chart)
# =============================================================================

postgresql:
  # -- Deploy PostgreSQL as part of this chart (with PGMQ + pg_cron)
  enabled: true

  # -- Time allowed for the pre-stop fast checkpoint and clean shutdown.
  terminationGracePeriodSeconds: 60

  image:
    repository: ghcr.io/rootcx/postgresql
    tag: "16-pgmq1.5.0-rootcx1"
    pullPolicy: IfNotPresent

  auth:
    username: rootcx
    # Auto-generated and preserved in quickstart mode; required in production.
    password: ""
    database: rootcx

  # -- Additional databases created in the same PostgreSQL server on first initialization
  extraDatabases: []

  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""
    retentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    # Used on Kubernetes. Omitted automatically when global.platform=openshift.
    fsGroup: 26
    fsGroupChangePolicy: OnRootMismatch

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# =============================================================================
# TRUSTED CA (for self-signed ingress certificates)
# =============================================================================

# -- Name of a ConfigMap containing a ca-bundle.crt key to trust
# The chart mounts this at /etc/pki/tls/certs and sets SSL_CERT_FILE.
# On OpenShift with self-signed router certs, create a ConfigMap from
# the ingress-operator CA and reference it here.
trustedCA: ""

# =============================================================================
# NETWORK POLICY
# =============================================================================

networkPolicy:
  # -- Create a NetworkPolicy for tenant isolation
  enabled: false
  # -- DNS port (53 for vanilla k8s, 5353 for OpenShift)
  dnsPort: 53
  # -- Namespace label selector for DNS namespace
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  # -- Namespace label selector for ingress controller namespace
  ingressNamespaceSelector: {}
  # -- Additional egress rules. Required when the AI Gateway or another
  # dependency uses a private cluster address or RFC1918 network.
  extraEgress: []

# =============================================================================
# EXTRA ENVIRONMENT VARIABLES
# =============================================================================

# -- Additional environment variables for the Core container
extraEnvVars: []
#  - name: SOME_VAR
#    value: "some-value"

# -- Reference existing secrets as env vars
extraEnvVarsSecret: ""

# =============================================================================
# NODE SCHEDULING
# =============================================================================

nodeSelector: {}
tolerations: []
affinity: {}
