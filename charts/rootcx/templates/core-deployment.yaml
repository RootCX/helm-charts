apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rootcx-core.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  strategy:
    {{- toYaml .Values.core.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rootcx-core.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      {{- if or (not .Values.core.existingSecret) .Values.core.podAnnotations }}
      annotations:
        {{- if not .Values.core.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/core-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.core.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "rootcx-core.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
    spec:
      {{- with .Values.core.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rootcx-core.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.core.podSecurityContext }}
      securityContext:
        {{- if eq (include "rootcx-core.platform" $) "openshift" }}
        {{- omit . "fsGroup" "fsGroupChangePolicy" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: core
          {{- with .Values.core.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag }}"
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          env:
            - name: ROOTCX_BIND
              value: "true"
            {{- if (include "rootcx-core.publicUrl" .) }}
            - name: ROOTCX_PUBLIC_URL
              value: {{ include "rootcx-core.publicUrl" . | quote }}
            {{- end }}
            - name: ROOTCX_DISABLE_PASSWORD_LOGIN
              value: {{ .Values.core.disablePasswordLogin | quote }}
            - name: RUST_LOG
              value: {{ .Values.core.logLevel | quote }}
            {{- if .Values.core.ai.openai.baseUrl }}
            - name: ROOTCX_OPENAI_BASE_URL
              value: {{ .Values.core.ai.openai.baseUrl | quote }}
            {{- end }}
            {{- if (include "rootcx-core.oidcIssuer" .) }}
            - name: ROOTCX_OIDC_ISSUER
              value: {{ include "rootcx-core.oidcIssuer" . | quote }}
            - name: ROOTCX_OIDC_CLIENT_ID
              value: {{ include "rootcx-core.oidcClientId" . | quote }}
            {{- end }}
            {{- if .Values.core.trustedCA }}
            - name: SSL_CERT_FILE
              value: /etc/rootcx/tls/ca-bundle.crt
            {{- end }}
            {{- with .Values.core.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "rootcx-core.secretName" . }}
            {{- if .Values.core.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.core.extraEnvVarsSecret }}
            {{- end }}
          {{- with .Values.core.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.core.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.core.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.core.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.core.trustedCA }}
            - name: trusted-ca
              mountPath: /etc/rootcx/tls
              readOnly: true
            {{- end }}
      {{- if .Values.core.trustedCA }}
      initContainers:
        - name: merge-trusted-ca
          image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag }}"
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt /custom-ca/ca-bundle.crt > /merged-ca/ca-bundle.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: custom-ca
              mountPath: /custom-ca
              readOnly: true
            - name: trusted-ca
              mountPath: /merged-ca
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.core.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.core.persistence.existingClaim | default (include "rootcx-core.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.core.trustedCA }}
        - name: custom-ca
          configMap:
            name: {{ .Values.core.trustedCA }}
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        - name: trusted-ca
          emptyDir: {}
        {{- end }}
      {{- with .Values.core.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
