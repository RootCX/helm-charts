{{- $managedHost := dig "hosts" "core" "" .Values.global.rootcx -}}
{{- $tlsSecret := dig "tls" "secretName" "" .Values.global.rootcx -}}
{{- $managed := and (eq (include "rootcx-core.platform" .) "kubernetes") $managedHost -}}
{{- if or .Values.core.ingress.enabled $managed -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rootcx-core.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
  {{- with .Values.core.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.core.ingress.className }}
  ingressClassName: {{ .Values.core.ingress.className }}
  {{- end }}
  {{- if and $managedHost $tlsSecret }}
  tls:
    - hosts:
        - {{ $managedHost | quote }}
      secretName: {{ $tlsSecret | quote }}
  {{- else if .Values.core.ingress.tls }}
  tls:
    {{- range .Values.core.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if $managedHost }}
    - host: {{ $managedHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rootcx-core.fullname" . }}
                port:
                  name: http
    {{- else }}
    {{- range .Values.core.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "rootcx-core.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
