{{- if .Values.core.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rootcx-core.serviceAccountName" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
  {{- with .Values.core.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
