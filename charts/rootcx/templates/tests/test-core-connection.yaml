apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rootcx-core.fullname" . }}-test-connection"
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: core
      image: curlimages/curl:8.17.0
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "rootcx-core.fullname" . }}:{{ .Values.core.service.port }}/health
      securityContext:
        allowPrivilegeEscalation: false
        {{- if ne (include "rootcx-core.platform" .) "openshift" }}
        runAsUser: 100
        runAsGroup: 101
        {{- end }}
        capabilities:
          drop: ["ALL"]
  restartPolicy: Never
