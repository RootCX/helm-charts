{{- if .Values.core.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rootcx-core.postgresql.fullname" . }}
  labels:
    {{- include "rootcx-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "rootcx-core.postgresql.fullname" . }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml .Values.core.postgresql.persistence.retentionPolicy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rootcx-core.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "rootcx-core.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- with .Values.core.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rootcx-core.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.core.postgresql.terminationGracePeriodSeconds }}
      {{- with .Values.core.postgresql.podSecurityContext }}
      securityContext:
        {{- if eq (include "rootcx-core.platform" $) "openshift" }}
        {{- omit . "fsGroup" "fsGroupChangePolicy" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.core.postgresql.image.repository }}:{{ .Values.core.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.core.postgresql.image.pullPolicy }}
          command: ["/pg-entrypoint.sh"]
          {{- with .Values.core.postgresql.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.core.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rootcx-core.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.core.postgresql.auth.database | quote }}
            {{- range .Values.core.postgresql.extraDatabases }}
            {{- if not (regexMatch "^[a-zA-Z_][a-zA-Z0-9_]{0,62}$" .) }}
            {{- fail (printf "invalid core.postgresql.extraDatabases entry: %s" .) }}
            {{- end }}
            {{- end }}
            - name: POSTGRES_EXTRA_DATABASES
              value: {{ join "," .Values.core.postgresql.extraDatabases | quote }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - {{ .Values.core.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.core.postgresql.auth.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - {{ .Values.core.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.core.postgresql.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          {{- with .Values.core.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pgdata
              mountPath: /data
            - name: tmp
              mountPath: /tmp
  {{- if and .Values.core.postgresql.persistence.enabled (not .Values.core.postgresql.persistence.existingClaim) }}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - {{ .Values.core.postgresql.persistence.accessMode }}
        {{- if .Values.core.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.core.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.core.postgresql.persistence.size }}
  {{- else if .Values.core.postgresql.persistence.existingClaim }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pgdata
          persistentVolumeClaim:
            claimName: {{ .Values.core.postgresql.persistence.existingClaim }}
  {{- else }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pgdata
          emptyDir: {}
  {{- end }}
{{- end }}
