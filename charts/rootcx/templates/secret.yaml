{{- if not .Values.existingSecret }}
{{- $secretName := include "rootcx-portal.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = default dict $existing.data -}}
{{- end -}}
{{- $authSecret := .Values.auth.secret -}}
{{- if and (not $authSecret) (hasKey $existingData "AUTH_SECRET") -}}
{{- $authSecret = index $existingData "AUTH_SECRET" | b64dec -}}
{{- else if not $authSecret -}}
{{- $authSecret = randAlphaNum 64 -}}
{{- end -}}
{{- $signingKey := get (default dict .Values.oidc) "signingKey" -}}
{{- if and (not $signingKey) (hasKey $existingData "OIDC_SIGNING_KEY") -}}
{{- $signingKey = index $existingData "OIDC_SIGNING_KEY" | b64dec -}}
{{- else if not $signingKey -}}
{{- $signingKey = genPrivateKey "rsa" -}}
{{- end -}}
{{- $oidcClientSecret := include "rootcx-portal.oidcClientSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rootcx-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.core.postgresql.enabled }}
  DATABASE_URL: {{ required "portalDatabase.url is required when core.postgresql.enabled=false" .Values.portalDatabase.url | quote }}
  {{- end }}
  AUTH_SECRET: {{ $authSecret | quote }}
  NEXTAUTH_SECRET: {{ $authSecret | quote }}
  OIDC_SIGNING_KEY: {{ $signingKey | quote }}
  ROOTCX_OIDC_CLIENT_SECRET: {{ $oidcClientSecret | quote }}
  {{- if and .Values.email.enabled .Values.email.smtp.username }}
  {{- if not $.Values.email.smtp.password }}
  {{- fail "email.smtp.password is required when email.smtp.username is set" }}
  {{- end }}
  SMTP_PASSWORD: {{ .Values.email.smtp.password | quote }}
  {{- end }}
{{- end }}
